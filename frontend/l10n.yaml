# Generates AppLocalizations from the ARB files (`flutter gen-l10n`, also run by `flutter pub get`).
# Dutch is the template: every key exists there first, with its description.
arb-dir: lib/l10n
template-arb-file: app_nl.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: false
