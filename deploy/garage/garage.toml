# Garage (S3-compatible object storage) for a deployed RepairTrack stack: one node, no replication.
# No secrets in this file: the RPC secret comes from GARAGE_RPC_SECRET in the stack's .env, the bucket and its
# access key from GARAGE_DEFAULT_* (created on startup by `garage server --single-node --default-bucket`).
# The admin API is not enabled.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.internal"
