# Serves the Flutter web build (static files only). TLS, the /api proxy and security headers are handled by the
# edge reverse proxy (Caddy); this server is only reachable inside the Docker network.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Health check for Docker / the deploy script.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never cache the entry points: a new release must be picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Privacy policy: a static page (readable without JavaScript, e.g. by app store reviewers).
    location = /privacy {
        default_type text/html;
        add_header Cache-Control "no-cache";
        try_files /privacy.html =404;
    }

    # Path URL strategy (/v/<token>, /verify-email, ...): unknown paths are app routes, served by index.html.
    # Share tokens in the path are not logged (access_log off).
    location / {
        access_log off;
        try_files $uri $uri/ /index.html;
    }
}
