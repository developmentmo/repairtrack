# Local development profile. Activate with SPRING_PROFILES_ACTIVE=local.
# Defaults match docker-compose.yml. Environment variables still take precedence.
# These are throwaway local credentials, never used outside a developer machine.

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/repairtrack}
    username: ${DATABASE_USERNAME:repairtrack}
    password: ${DATABASE_PASSWORD:repairtrack}

repairtrack:
  security:
    jwt:
      # Local development only. Any real environment MUST set JWT_SECRET.
      secret: ${JWT_SECRET:local-development-secret-do-not-use-anywhere-else}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.repairtrack: DEBUG
