# Local development infrastructure. The application itself runs from the IDE.
#   postgres: database
#   garage:   S3-compatible object storage for documents (https://garagehq.deuxfleurs.fr)
#   clamav:   malware scanner for uploads (clamd, port 3310)
#   mailpit:  catches outgoing email (http://localhost:8025)

name: repairtrack

services:
  postgres:
    image: postgres:18-alpine
    container_name: repairtrack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repairtrack}
      POSTGRES_USER: ${POSTGRES_USER:-repairtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repairtrack}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only: the dev database is never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5333}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: repairtrack-garage
    # --single-node: configure a one-node cluster automatically.
    # --default-bucket: create the bucket and access key below on startup.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Garage key format: "GK" + 32 hex characters; secret: 64 hex characters. Local values only.
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-repairtrack-documents}
    ports:
      - "127.0.0.1:3900:3900" # S3 API
      - "127.0.0.1:3903:3903" # admin API (/health)
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    # The image has no shell, so no in-container healthcheck; use: curl -s localhost:3903/health
    restart: unless-stopped

  clamav:
    # Malware scanner for uploads (clamd on 3310). Needs ~1.5 GB RAM; the first start downloads the virus
    # definitions and takes a few minutes. Skip it with MALWARE_SCAN_MODE=disabled for the backend.
    # clamav-debian is multi-arch (amd64 + arm64/Apple Silicon); the alpine-based clamav/clamav is amd64 only.
    image: clamav/clamav-debian:1.4
    container_name: repairtrack-clamav
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  mailpit:
    # Catches all outgoing email locally: open http://localhost:8025 to read verification and reset mails.
    image: axllent/mailpit:latest
    container_name: repairtrack-mailpit
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI
    restart: unless-stopped

volumes:
  clamav-db:
  postgres-data:
  garage-meta:
  garage-data:
