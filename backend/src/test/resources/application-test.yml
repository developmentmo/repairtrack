# Test profile. The real connection details are supplied by Testcontainers via @ServiceConnection,
# which takes precedence over these properties. The placeholders below only satisfy the
# ${DATABASE_*} references in application.yml, which have no defaults by design.

spring:
  datasource:
    url: jdbc:postgresql://provided-by-testcontainers/unused
    username: provided-by-testcontainers
    password: provided-by-testcontainers

repairtrack:
  security:
    jwt:
      secret: test-secret-only-used-by-automated-tests-0123456789
  # Real values are supplied at runtime from the Garage Testcontainer (TestcontainersConfiguration).
  storage:
    region: garage
    bucket: repairtrack-test
  sharing:
    public-base-url: https://test.repairtrack.example
