# Test profile. The real connection details are supplied by Testcontainers via @ServiceConnection,
# which takes precedence over these properties. The placeholders below only satisfy the
# ${DATABASE_*} references in application.yml, which have no defaults by design.

spring:
  # Never used: integration tests replace the mailer with a recording one (TestcontainersConfiguration).
  mail:
    host: localhost
  datasource:
    url: jdbc:postgresql://provided-by-testcontainers/unused
    username: provided-by-testcontainers
    password: provided-by-testcontainers

repairtrack:
  security:
    jwt:
      secret: test-secret-only-used-by-automated-tests-0123456789
    refresh-token-cleanup-cron: "-"
  # All integration tests come from 127.0.0.1; RateLimitIT switches the per-IP limits on for itself.
  rate-limit:
    enabled: false
  # Real values are supplied at runtime from the Garage Testcontainer (TestcontainersConfiguration).
  # Integration tests use FakeMalwareScanner (TestcontainersConfiguration); ClamAvScannerTest covers the protocol.
  malware-scan:
    mode: disabled
  # Tests never call the real RDW; RdwOpenDataRegistryTest covers the client against a fake server.
  vehicle-registry:
    mode: disabled
  storage:
    integrity-sweep-cron: "-"
    region: garage
    bucket: repairtrack-test
  sharing:
    public-base-url: https://test.repairtrack.example
  mail:
    from: RepairTrack <noreply@test.repairtrack.example>
    link-base-url: https://test.repairtrack.example
  cors:
    allowed-origins: https://app.repairtrack.example
