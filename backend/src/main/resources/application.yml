# Base configuration. Contains NO environment-specific values and NO secrets.
# Connection settings come from environment variables; the app fails fast at startup if they are missing.
# For local development, activate the `local` profile (see application-local.yml).

spring:
  application:
    name: repairtrack

  # Outgoing account emails (verification, password reset). Required outside `local`.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: repairtrack-pool
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}

  jpa:
    # Never hold a DB connection for the whole web request; transactions live in application services.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      # Hard limit enforced by the servlet container; the document service checks repairtrack.storage.max-file-size too.
      max-file-size: 20MB
      max-request-size: 21MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Guard against accidental data loss: `flyway clean` must never run against a real database.
    clean-disabled: true

  mvc:
    problemdetails:
      # We use our own ApiErrorResponse format (GlobalExceptionHandler), not RFC 9457 ProblemDetail.
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  # Behind a trusted reverse proxy set to `framework`, so rate limits see the real client IP (X-Forwarded-For).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    # Never leak stack traces or exception messages through Boot's fallback /error endpoint.
    include-stacktrace: never
    include-message: never

repairtrack:
  # Zone in which user-entered calendar dates are interpreted ("today", "not in the future").
  business-time-zone: Europe/Amsterdam
  security:
    jwt:
      # HS256 signing secret, at least 32 bytes. Generate with: openssl rand -base64 48
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:repairtrack}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    # Daily deletion of expired refresh tokens ("-" disables it).
    refresh-token-cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 30 3 * * *}
  # Abuse protection (see RateLimitProperties for all limits and their defaults).
  mail:
    # Sender address of account emails, e.g. "RepairTrack <noreply@repairtrack.nl>".
    from: ${MAIL_FROM}
    # Links in emails open the web app: {link-base-url}/verify-email?token=... and /reset-password?token=...
    link-base-url: ${PUBLIC_BASE_URL}
  # Malware scan of every upload before it is stored. `clamav` (default, fail closed) or `disabled`.
  malware-scan:
    mode: ${MALWARE_SCAN_MODE:clamav}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  # Public RDW data to pre-fill the vehicle form (a suggestion, never proof). `rdw` (default) or `disabled`.
  vehicle-registry:
    mode: ${RDW_MODE:rdw}
    base-url: ${RDW_BASE_URL:https://opendata.rdw.nl}
    # Optional Socrata app token for higher RDW rate limits.
    app-token: ${RDW_APP_TOKEN:}
    cache-ttl: 24h
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      requests: 10
      per: 1m
    login-failures-per-account:
      requests: 10
      per: 15m
  storage:
    # Weekly re-check of every stored document's SHA-256 ("-" disables it).
    integrity-sweep-cron: ${INTEGRITY_SWEEP_CRON:0 0 4 * * SUN}
    # Empty endpoint = AWS default endpoint for the region. Empty access key = AWS default credentials chain.
    endpoint: ${S3_ENDPOINT:}
    # Endpoint as reachable by clients, used in presigned download URLs (defaults to endpoint).
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    presigned-url-ttl: 5m
    max-file-size: 20MB
  cors:
    # Comma-separated browser origins allowed to call the API (the Flutter web app). Empty = none.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  sharing:
    # Base of human-facing share links ({base}/v/{token}); the Flutter web app serves that route.
    public-base-url: ${PUBLIC_BASE_URL}
    default-validity: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Kubernetes-style liveness/readiness groups: /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true
      show-details: never
  health:
    # An SMTP outage must not mark the application as down; failed emails can be re-sent by the user.
    mail:
      enabled: false
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.repairtrack: INFO
