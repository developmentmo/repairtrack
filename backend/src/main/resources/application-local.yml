# Local development profile. Activate with SPRING_PROFILES_ACTIVE=local.
# Defaults match docker-compose.yml. Environment variables still take precedence.
# These are throwaway local credentials, never used outside a developer machine.

spring:
  # Mailpit from docker-compose.yml: SMTP on 1025, web UI on http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/repairtrack}
    username: ${DATABASE_USERNAME:repairtrack}
    password: ${DATABASE_PASSWORD:repairtrack}

repairtrack:
  security:
    jwt:
      # Local development only. Any real environment MUST set JWT_SECRET.
      secret: ${JWT_SECRET:local-development-secret-do-not-use-anywhere-else}
  mail:
    from: ${MAIL_FROM:RepairTrack <noreply@repairtrack.local>}
    link-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  # The Flutter web app in development: flutter run -d chrome --web-port 5173
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  sharing:
    # Share links open the public report in the web app.
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  # Matches the garage service in docker-compose.yml (throwaway local credentials).
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:3900}
    region: ${S3_REGION:garage}
    access-key: ${S3_ACCESS_KEY:GK0123456789abcdef0123456789abcdef}
    secret-key: ${S3_SECRET_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    bucket: ${S3_BUCKET:repairtrack-documents}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.repairtrack: DEBUG
